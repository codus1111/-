<html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#141414;color:#EDEDED;width:100vw;height:100vh;position:relative;overflow:hidden}.mark{position:absolute;right:28px;bottom:20px;font-size:16px;font-weight:bold;letter-spacing:3px;color:#F5F5F5;opacity:.5}
